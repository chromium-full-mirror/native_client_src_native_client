buckets {
  name: "luci.nacl.toolchain"
  acl_sets: "ci"
  swarming {
    hostname: "chromium-swarm.appspot.com"
    builder_defaults {
      dimensions: "cores:8"
      dimensions: "cpu:x86-64"
      dimensions: "pool:luci.nacl.toolchain"
      service_account: "nacl-toolchain-builder@chops-service-accounts.iam.gserviceaccount.com"
      execution_timeout_secs: 10800  # 3h
      swarming_tags: "vpython:native-python-wrapper"
      build_numbers: YES
      luci_migration_host: "luci-migration.appspot.com"
      recipe {
        cipd_package: "infra/recipe_bundles/chromium.googlesource.com/chromium/tools/build"
        cipd_version: "refs/heads/master"
        name: "nacl"
        properties: "mastername:client.nacl.toolchain"
        properties: "slavetype:BuilderTester"
      }
    }

    builders {
      name: "linux-pnacl-x86_32-tests-mips"
      mixins: "linux"
    }
    builders {
      name: "linux-pnacl-x86_64"
      mixins: "linux"
    }
    builders {
      name: "linux-pnacl-x86_64-tests-arm"
      mixins: "linux"
    }
    builders {
      name: "linux-pnacl-x86_64-tests-x86_32"
      mixins: "linux"
    }
    builders {
      name: "linux-pnacl-x86_64-tests-x86_64"
      mixins: "linux"
    }
    builders {
      name: "mac-pnacl-x86_32"
      mixins: "mac"
    }
    builders {
      name: "win-pnacl-x86_32"
      mixins: "win"
    }
  }
}


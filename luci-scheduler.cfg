# Defines jobs on luci-scheduler.appspot.com.
#
# For schema of this file and documentation see ProjectConfig message in
#
# https://chromium.googlesource.com/infra/luci/luci-go/+/master/scheduler/appengine/messages/config.proto

acl_sets {
  name: "default"
  acls {
    role: READER
    granted_to: "group:all"
  }
  acls {
    role: OWNER
    granted_to: "group:project-nacl-admins"
  }
}

trigger {
  id: "master-gitiles-trigger"
  acl_sets: "default"
  gitiles: {
    repo: "https://chromium.googlesource.com/native_client/src/native_client.git"
    refs: "refs/heads/master"
  }

  # Main triggers
  triggers: "linux-32-glibc-dbg"
  triggers: "linux-32-glibc-opt"
  triggers: "linux-32-newlib-dbg"
  triggers: "linux-32-newlib-opt"
  triggers: "linux-64-arm-glibc-opt"
  triggers: "linux-64-arm-newlib-opt"
  triggers: "linux-64-glibc-dbg"
  triggers: "linux-64-glibc-opt"
  triggers: "linux-64-newlib-dbg"
  triggers: "linux-64-newlib-opt"
  triggers: "linux-64-newlib-opt-test"
  triggers: "linux-64-validator-opt"
  triggers: "linux_64-newlib-arm_qemu-pnacl-buildonly-spec"
  triggers: "linux_64-newlib-arm_qemu-pnacl-dbg"
  triggers: "linux_64-newlib-arm_qemu-pnacl-opt"
  triggers: "linux_64-newlib-dbg-asan"
  triggers: "linux_64-newlib-mips-pnacl"
  triggers: "linux_64-newlib-x86_32-pnacl"
  triggers: "linux_64-newlib-x86_32-pnacl-spec"
  triggers: "linux_64-newlib-x86_32-spec"
  triggers: "linux_64-newlib-x86_64-pnacl"
  triggers: "linux_64-newlib-x86_64-pnacl-spec"
  triggers: "linux_64-newlib-x86_64-spec"
  triggers: "mac-arm-newlib-opt"
  triggers: "mac-glibc-dbg"
  triggers: "mac-glibc-opt"
  triggers: "mac-newlib-dbg"
  triggers: "mac-newlib-dbg-asan"
  triggers: "mac-newlib-opt"
  triggers: "mac-newlib-opt-pnacl"
  triggers: "oneiric_32-newlib-arm_hw-pnacl-panda-dbg"
  triggers: "oneiric_32-newlib-arm_hw-pnacl-panda-opt"
  triggers: "oneiric_32-newlib-arm_hw-pnacl-panda-spec"
  triggers: "win7-64-arm-newlib-opt"
  triggers: "win7-64-glibc-dbg"
  triggers: "win7-64-glibc-opt"
  triggers: "win7-64-newlib-opt-pnacl"
  triggers: "win8-64-newlib-dbg"
  triggers: "win8-64-newlib-opt"

  # Toolchain Triggers
  triggers: "linux-pnacl-x86_32"
  triggers: "linux-pnacl-x86_32-tests-mips"
  triggers: "linux-pnacl-x86_64"
  triggers: "linux-pnacl-x86_64-tests-arm"
  triggers: "linux-pnacl-x86_64-tests-x86_32"
  triggers: "linux-pnacl-x86_64-tests-x86_64"
  triggers: "linux64-glibc"
  triggers: "linux64-toolchain_arm"
  triggers: "mac-glibc"
  triggers: "mac-pnacl-x86_32"
  triggers: "mac-toolchain_arm"
  triggers: "win-pnacl-x86_32"
  triggers: "win7-glibc"
}


